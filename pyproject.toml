[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Provider-independent LLM agent harness: loop, validated tools, permission gate, context management, sandbox"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]

[project.scripts]
agent-harness = "agent_harness.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_harness*"]
